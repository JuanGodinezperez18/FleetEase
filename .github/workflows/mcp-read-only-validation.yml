name: MCP read-only validation

on:
  push:
    branches:
      - audit/mcp-multitenant-security-costs
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: mcp-read-only-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Require committed lockfile
        run: test -f package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: MCP unit tests
        run: npm run test:ci -- --runInBand src/lib/mcp/policy.test.ts src/lib/mcp/tools.test.ts src/app/.well-known/oauth-protected-resource/api/mcp/route.test.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key

      - name: Existing full regression suite (diagnostic)
        continue-on-error: true
        run: npm run test:ci -- --runInBand
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
