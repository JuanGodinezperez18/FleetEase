name: Dependency remediation preview

on:
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/dependency-remediation-preview.yml"

permissions:
  contents: read

jobs:
  preview-compatible-fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install committed dependency tree
        run: npm ci
      - name: Apply non-forced npm audit fixes for preview only
        run: npm audit fix || true
      - name: Capture resulting production audit
        run: npm audit --omit=dev --json > audit-after.json || true
      - name: Upload preview package files and audit report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-remediation-preview
          path: |
            package.json
            package-lock.json
            audit-after.json
          if-no-files-found: error
          retention-days: 3
