name: Lighthouse CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

env:
  # CI builds do not have production secrets. These values only prevent
  # server-only Supabase clients from failing during Next.js module evaluation.
  NEXT_PUBLIC_SUPABASE_URL: https://build-placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: build-placeholder-anon-key
  SUPABASE_SERVICE_ROLE_KEY: build-placeholder-service-role-key

jobs:
  lighthouse:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build application
        run: npm run build

      - name: Start application
        run: npm run start > /tmp/fleetease.log 2>&1 &

      - name: Wait for application
        run: npx wait-on http://localhost:3000 --timeout 60000

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: ./.lighthouserc.json

      - name: Upload Lighthouse reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: ./lighthouse-reports
          retention-days: 30

      - name: Show application log on failure
        if: failure()
        run: cat /tmp/fleetease.log || true

  performance-budget:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build and analyze bundle
        run: |
          npm run build
          npm run analyze:bundle || true

      - name: Upload bundle analysis
        uses: actions/upload-artifact@v4
        with:
          name: bundle-analysis
          path: ./bundle-analysis-report.json
          retention-days: 7
