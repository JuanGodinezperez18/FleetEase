name: Temporary lockfile repair
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [master]
permissions:
  contents: write
  pull-requests: read
jobs:
  repair:
    if: github.event.pull_request.number == 95 && github.event.pull_request.head.ref == 'feat/lovable-landing-replica-2026-10-26' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/lovable-landing-replica-2026-10-26
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile from package manifest
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean installation
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit only the regenerated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix: synchronize npm lockfile"
          git push origin HEAD:feat/lovable-landing-replica-2026-10-26
