name: FleetEase database backup

on:
  schedule:
    - cron: '30 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  PGSSLMODE: require

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /etc/apt/keyrings
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/keyrings/postgresql.gpg
          echo "deb [signed-by=/etc/apt/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo $VERSION_CODENAME)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version
          test "$(/usr/lib/postgresql/17/bin/pg_dump --version | awk '{print $3}' | cut -d. -f1)" = "17"

      - name: Create compressed database dump
        env:
          SUPABASE_POOLER_DB_URL: ${{ secrets.SUPABASE_POOLER_DB_URL }}
        run: |
          test -n "$SUPABASE_POOLER_DB_URL" || (echo 'Missing SUPABASE_POOLER_DB_URL GitHub secret' && exit 1)
          mkdir -p backups
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_POOLER_DB_URL" \
            --format=custom \
            --no-owner \
            --no-privileges \
            --file="backups/fleetease-$(date -u +%Y-%m-%dT%H-%M-%SZ).dump"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: fleetease-database-backup-${{ github.run_id }}
          path: backups/*.dump
          retention-days: 30
          if-no-files-found: error

      - name: Verify backup file
        run: |
          ls -lh backups/
          test -s backups/*.dump
