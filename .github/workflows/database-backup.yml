name: FleetEase database backup

on:
  schedule:
    - cron: '30 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  PGSSLMODE: require

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Create compressed database dump
        env:
          SUPABASE_POOLER_DB_URL: ${{ secrets.SUPABASE_POOLER_DB_URL }}
        run: |
          test -n "$SUPABASE_POOLER_DB_URL" || (echo 'Missing SUPABASE_POOLER_DB_URL GitHub secret' && exit 1)
          mkdir -p backups
          pg_dump "$SUPABASE_POOLER_DB_URL" \
            --format=custom \
            --no-owner \
            --no-privileges \
            --file="backups/fleetease-$(date -u +%Y-%m-%dT%H-%M-%SZ).dump"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: fleetease-database-backup-${{ github.run_id }}
          path: backups/*.dump
          retention-days: 30
          if-no-files-found: error

      - name: Verify backup file
        run: |
          ls -lh backups/
          test -s backups/*.dump
