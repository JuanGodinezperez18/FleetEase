name: One-time client balance consistency fix

on:
  push:

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[skip client balance fix]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Exclude security deposits from shared client balances
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/contexts/data-provider-supabase.tsx')
          text = path.read_text(encoding='utf-8')
          old = """      let currentBalance = balances.get(record.clientId)!;\n      if (record.type === 'income') {\n        currentBalance += record.amount;\n      } else if (record.type === 'payment') {\n        currentBalance -= record.amount;\n      }\n      balances.set(record.clientId, currentBalance);"""
          new = """      // Depósito en Garantía es dinero retenido, no una cuenta por cobrar.\n      // Debe permanecer visible en transacciones y securityDeposit, pero no puede aumentar la deuda del cliente.\n      if (record.category === SECURITY_DEPOSIT_CATEGORY) return;\n\n      let currentBalance = balances.get(record.clientId)!;\n      if (record.type === 'income') {\n        currentBalance += record.amount;\n      } else if (record.type === 'payment') {\n        currentBalance -= record.amount;\n      }\n      balances.set(record.clientId, currentBalance);"""
          if old not in text:
              raise SystemExit('Expected client balance block was not found; refusing to modify the file.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/contexts/data-provider-supabase.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix(clients): exclude security deposits from shared balance [skip client balance fix]"
          git push
