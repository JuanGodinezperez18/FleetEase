name: FleetEase quality gate

on:
  push:
    branches:
      - security/performance-hardening
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  payment-sql:
    name: Atomic payment SQL regression
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: payment_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify atomic edit and permissions in isolated PostgreSQL
        run: psql -h localhost -U postgres -d payment_test -v ON_ERROR_STOP=1 -f supabase/tests/atomic_payment_edit.sql
        env:
          PGPASSWORD: isolated-ci-only
      - name: Verify credit completion against assignment history
        run: psql -h localhost -U postgres -d payment_test -v ON_ERROR_STOP=1 -f supabase/tests/credit_assignment_lifecycle.sql
        env:
          PGPASSWORD: isolated-ci-only
      - name: Verify concurrent retries of the same credit payment
        run: bash supabase/tests/credit_payment_concurrency.sh
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGDATABASE: payment_test
          PGPASSWORD: isolated-ci-only
  dependency-audit:
    name: Dependency security gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Require committed lockfile
        run: test -f package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Fail on high or critical production advisories
        run: npm audit --omit=dev --audit-level=high
      - name: Inventory all dependencies including development tooling
        if: always()
        shell: bash
        run: |
          set +e
          npm audit --json > dependency-audit.json
          audit_status=$?
          node -e "const a=require('./dependency-audit.json'); if(a.error || !a.metadata) process.exit(1); console.log(JSON.stringify(a.metadata.vulnerabilities))"
          report_status=$?
          if [ "$report_status" -ne 0 ] || [ "$audit_status" -gt 1 ]; then
            echo "::error::Dependency inventory could not be obtained."
            exit 1
          fi
      - name: Upload dependency inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: dependency-audit.json
          if-no-files-found: error


  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Require committed lockfile
        run: |
          if [ ! -f package-lock.json ]; then
            echo "::error::package-lock.json is required for reproducible CI installs."
            exit 1
          fi
      - run: npm ci --legacy-peer-deps
      - name: Auditoría de dependencias (npm audit)
        # Informativo hasta limpiar el backlog de advisories; falla visiblemente
        # en el log del workflow sin bloquear el resto del quality gate.
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
      - name: Pruebas de regresión
        run: npm run test:ci -- --runInBand src/lib/__tests__/zod-resolver-compatibility.test.ts src/__tests__/middleware.test.ts src/__tests__/contexts/auth-boot.test.tsx src/lib/shared-links.test.ts src/lib/security/notification-scope.test.ts src/lib/security/admin-target-scope.test.ts src/app/api/notifications/tenant-isolation.test.ts src/app/api/admin/users/email-delivery.test.ts src/lib/rate-limit-production.test.ts
      - name: Reauditoría 5 de noviembre
        run: npm run test:ci -- --runInBand src/lib/credit-administration.test.ts src/lib/soft-delete.test.ts src/lib/reports/analytics-reconciliation.test.ts src/app/api/auth/login/route.test.ts src/__tests__/lib/financial-reconciliation.test.ts src/__tests__/lib/roles.test.ts
      - name: Referencias y fechas civiles de pagos
        run: npm run test:ci -- --runInBand src/__tests__/contexts/financial-record-projection.test.tsx src/__tests__/components/payment-history-date.test.tsx src/__tests__/components/payment-form-business-date.test.tsx src/__tests__/components/credit-business-date.test.tsx src/lib/schemas/vehicle-identifiers.test.ts src/__tests__/components/vehicle-form-identifiers.test.ts src/lib/credit-rpc.test.ts src/lib/credit-payment-request.test.ts src/__tests__/components/credit-detail-date.test.tsx
        env:
          TZ: America/Mexico_City
      - run: npm run type-check
      - name: Build
        run: npm run build
        env:
          # CI-only placeholders: production Supabase credentials are supplied by Vercel.
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
