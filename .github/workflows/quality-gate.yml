name: FleetEase quality gate

on:
  push:
    branches:
      - security/performance-hardening
      - chore/phase1-quality-gate-hardening
      - master
  pull_request:
    branches:
      - master

# Validation jobs should not be able to push commits to the repository.
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # package-lock.json is committed and reviewed like application code.
      # CI must fail if it is missing rather than generate/push a commit.
      - name: Verify lockfile
        run: test -f package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Dependency audit
        # Temporarily informational while the existing advisory backlog is triaged.
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run type-check

      - name: Unit tests
        run: npm run test:ci -- --runInBand

      - name: Build
        run: npm run build
        env:
          # CI-only placeholders: production Supabase credentials are supplied by Vercel.
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
