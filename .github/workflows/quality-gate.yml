name: FleetEase quality gate

on:
  push:
    branches:
      - security/performance-hardening
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency security gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Require committed lockfile
        run: test -f package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Fail on high or critical production advisories
        run: npm audit --omit=dev --audit-level=high
      - name: Inventory all dependencies including development tooling
        if: always()
        shell: bash
        run: |
          set +e
          npm audit --json > dependency-audit.json
          audit_status=$?
          node -e "const a=require('./dependency-audit.json'); if(a.error || !a.metadata) process.exit(1); console.log(JSON.stringify(a.metadata.vulnerabilities))"
          report_status=$?
          if [ "$report_status" -ne 0 ] || [ "$audit_status" -gt 1 ]; then
            echo "::error::Dependency inventory could not be obtained."
            exit 1
          fi
      - name: Upload dependency inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: dependency-audit.json
          if-no-files-found: error


  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Require committed lockfile
        run: |
          if [ ! -f package-lock.json ]; then
            echo "::error::package-lock.json is required for reproducible CI installs."
            exit 1
          fi
      - run: npm ci --legacy-peer-deps
      - name: Auditoría de dependencias (npm audit)
        # Informativo hasta limpiar el backlog de advisories; falla visiblemente
        # en el log del workflow sin bloquear el resto del quality gate.
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
      - name: Pruebas de regresión
        run: npm run test:ci -- --runInBand src/lib/__tests__/zod-resolver-compatibility.test.ts src/__tests__/middleware.test.ts src/__tests__/contexts/auth-boot.test.tsx src/lib/shared-links.test.ts src/lib/security/notification-scope.test.ts src/lib/security/admin-target-scope.test.ts src/app/api/notifications/tenant-isolation.test.ts src/app/api/admin/users/email-delivery.test.ts src/lib/rate-limit-production.test.ts
      - run: npm run type-check
      - name: Build
        run: npm run build
        env:
          # CI-only placeholders: production Supabase credentials are supplied by Vercel.
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
