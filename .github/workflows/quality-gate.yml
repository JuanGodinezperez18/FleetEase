name: FleetEase quality gate

on:
  push:
    branches:
      - security/performance-hardening
      - chore/phase1-quality-gate-hardening
      - master
  pull_request:
    branches:
      - master

# Validation jobs should not be able to push commits to the repository.
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # package-lock.json is committed and reviewed like application code.
      # CI must fail if it is missing rather than generate/push a commit.
      - name: Verify lockfile
        run: test -f package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Dependency audit
        # Temporarily informational while the existing advisory backlog is triaged.
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      # Incremental lint gate: enforce the configured rules on files changed by
      # this PR/push while the full-repository lint backlog is tracked separately.
      - name: ESLint changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "::error::Could not resolve the base commit for incremental ESLint."
            exit 1
          fi

          mapfile -t files < <(
            git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$GITHUB_SHA" -- \
              '*.js' '*.jsx' '*.ts' '*.tsx' '*.mjs' '*.cjs'
          )

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No JavaScript/TypeScript files changed; ESLint has nothing to check."
            exit 0
          fi

          printf 'Linting %s changed file(s):\n' "${#files[@]}"
          printf ' - %s\n' "${files[@]}"
          npx eslint --no-warn-ignored "${files[@]}"

      - name: TypeScript
        run: npm run type-check

      - name: Unit tests
        run: npm run test:ci -- --runInBand

      - name: Build
        run: npm run build
        env:
          # CI-only placeholders: production Supabase credentials are supplied by Vercel.
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
