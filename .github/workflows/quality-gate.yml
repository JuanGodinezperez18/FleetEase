name: FleetEase quality gate

on:
  push:
    branches:
      - security/performance-hardening
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency security gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Require committed lockfile
        run: test -f package-lock.json
      - run: npm ci
      - name: Fail on high or critical production advisories
        run: npm audit --omit=dev --audit-level=high




  dependency-remediation-validation:
    name: Validate non-forced remediation candidate (isolated)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install committed dependency tree
        run: npm ci
      - name: Upgrade direct dependencies with fixes
        run: npm install 'jspdf@^4.2.1' 'next@16.4.2' 'sharp@^0.35.5' 'uuid@^11.1.1'
      - name: Apply remaining non-forced compatible fixes
        run: npm audit fix
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Run regression tests
        run: npm run test:ci -- --runInBand src/__tests__/middleware.test.ts src/lib/shared-links.test.ts src/lib/security/notification-scope.test.ts src/lib/security/admin-target-scope.test.ts
      - name: Type check
        run: npm run type-check
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      - name: Upload candidate package files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-remediation-candidate
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 3

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Require committed lockfile
        run: |
          if [ ! -f package-lock.json ]; then
            echo "::error::package-lock.json is required for reproducible CI installs."
            exit 1
          fi
      - run: npm ci
      - name: Auditoría de dependencias (npm audit)
        # Informativo hasta limpiar el backlog de advisories; falla visiblemente
        # en el log del workflow sin bloquear el resto del quality gate.
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
      - name: Pruebas de regresión del middleware
        run: npm run test:ci -- --runInBand src/__tests__/middleware.test.ts src/lib/shared-links.test.ts src/lib/security/notification-scope.test.ts src/lib/security/admin-target-scope.test.ts
      - run: npm run type-check
      - name: Build
        run: npm run build
        env:
          # CI-only placeholders: production Supabase credentials are supplied by Vercel.
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
