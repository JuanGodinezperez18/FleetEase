name: Temporary dependency candidate validation
on:
  push:
    branches:
      - audit/phase2-functional-security
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install committed dependency tree
        run: npm ci
      - name: Apply targeted dependency updates
        run: npm install 'jspdf@^4.2.1' 'next@16.4.2' 'sharp@^0.35.5' 'uuid@^11.1.1'
      - name: Apply compatible non-forced fixes
        run: npm audit fix
        continue-on-error: true
      - name: Enforce production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Regression tests
        run: npm run test:ci -- --runInBand src/__tests__/middleware.test.ts src/lib/shared-links.test.ts src/lib/security/notification-scope.test.ts src/lib/security/admin-target-scope.test.ts
      - name: Type check
        run: npm run type-check
      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          STRIPE_SECRET_KEY: sk_test_placeholder
        run: npm run build
      - name: Upload candidate lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-dependency-candidate-validated
          path: |
            package.json
            package-lock.json
          retention-days: 2
