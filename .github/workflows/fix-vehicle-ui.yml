name: Fix expense form partner validation

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - name: Patch expense form
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/dashboard/finanzas/expenses/components/ExpensesFormMultiLine.tsx')
          s = p.read_text(encoding='utf-8')
          old = """  useEffect(() => { const selectedCategory = localCategories.find(cat => cat.id === selectedCategoryId); if (selectedCategory?.id === PARTNER_PAYMENT_CATEGORY_ID) { form.setValue('clientId', NONE_SELECT_VALUE); const selectedVehicle = rawVehicles.find(v => v.id === selectedVehicleId); if (!selectedVehicle?.partnerId) { toast.error('El vehículo seleccionado no tiene socio asignado'); form.setValue('categoryId', ''); } } }, [selectedCategoryId, localCategories, form, rawVehicles, selectedVehicleId]);"""
          new = """  useEffect(() => {
    const selectedCategory = localCategories.find(cat => cat.id === selectedCategoryId);
    const isPartnerPaymentCategory = selectedCategory?.id === PARTNER_PAYMENT_CATEGORY_ID || selectedCategory?.name?.trim().toLowerCase() === 'pago a socio';

    if (!isPartnerPaymentCategory) return;
    if (!selectedVehicleId) {
      form.setValue('clientId', null);
      return;
    }

    const selectedVehicle = rawVehicles.find(v => v.id === selectedVehicleId);
    // Do not validate while the vehicle list is still loading.
    if (!selectedVehicle) return;

    form.setValue('clientId', NONE_SELECT_VALUE);
    if (!selectedVehicle.partnerId) {
      toast.error('El vehículo seleccionado no tiene socio asignado');
      form.setValue('categoryId', '');
      form.setValue('clientId', null);
    }
  }, [selectedCategoryId, localCategories, form, rawVehicles, selectedVehicleId]);"""
          if old not in s:
              raise SystemExit('Target effect not found; aborting.')
          p.write_text(s.replace(old, new), encoding='utf-8')
          print('Expense form patched.')
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/fix-vehicle-ui.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/dashboard/finanzas/expenses/components/ExpensesFormMultiLine.tsx .github/workflows/fix-vehicle-ui.yml
          git commit -m 'fix(finanzas): prevent partner validation toast on expense form open'
          git push